
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI School Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
}

header {
    background: #4338ca;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 750px;
    margin: 25px auto;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px #0002;
}

#chatbox {
    height: 400px;
    overflow-y: auto;
    padding: 10px;
    background: #f8fafc;
    border-radius: 10px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    max-width: 85%;
    line-height: 1.5;
}

.user {
    background: #dbeafe;
    margin-left: auto;
    text-align: right;
}

.bot {
    background: #dcfce7;
    margin-right: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    min-width: 0;
}

button {
    padding: 12px 18px;
    background: #4338ca;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #312e81;
}

@media(max-width: 500px) {
    .container {
        margin: 10px;
        padding: 12px;
    }

    #chatbox {
        height: 60vh;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 AI School Assistant</h1>
    <p>Your Smart Learning Partner</p>
</header>

<div class="container">

    <h2>नमस्ते विद्यार्थी! 👋</h2>
    <p>मुझसे पढ़ाई से जुड़े सवाल पूछिए।</p>

    <div id="chatbox">
        <div class="message bot">
            नमस्ते! 😊 मैं आपका AI School Assistant हूँ।
            आप मुझसे गणित, विज्ञान, हिंदी और अंग्रेजी के सवाल पूछ सकते हैं।
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="अपना सवाल लिखें..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

function sendMessage() {

    let input = document.getElementById("userInput");
    let question = input.value.trim();

    if (question === "") return;

    addMessage(question, "user");

    input.value = "";

    let answer = getAnswer(question.toLowerCase());

    setTimeout(function() {
        addMessage(answer, "bot");
    }, 500);
}

function addMessage(text, type) {

    let chatbox = document.getElementById("chatbox");

    let message = document.createElement("div");

    message.className = "message " + type;
    message.innerText = text;

    chatbox.appendChild(message);

    chatbox.scrollTop = chatbox.scrollHeight;
}

function getAnswer(q) {

    if (q.includes("hello") || q.includes("hi") || q.includes("नमस्ते")) {
        return "नमस्ते विद्यार्थी! 😊 आज आप क्या पढ़ना चाहते हैं?";
    }

    if (q.includes("2+2")) {
        return "2 + 2 = 4 🎉";
    }

    if (q.includes("प्रधानमंत्री")) {
        return "भारत के वर्तमान प्रधानमंत्री कौन हैं, इसकी जानकारी के लिए आधिकारिक सरकारी स्रोत देखें।";
    }

    if (q.includes("गणित") || q.includes("math")) {
        return "गणित में मैं आपकी मदद कर सकता हूँ। अपना सवाल लिखिए।";
    }

    if (q.includes("विज्ञान") || q.includes("science")) {
        return "विज्ञान हमें प्रकृति और दुनिया के बारे में सिखाता है। अपना सवाल पूछिए।";
    }

    if (q.includes("धन्यवाद") || q.includes("thank")) {
        return "आपका स्वागत है! 😊 पढ़ते रहिए और आगे बढ़ते रहिए।";
    }

    if (q.includes("आपका नाम")) {
        return "मेरा नाम AI School Assistant है। 🎓";
    }

    return "अच्छा सवाल है! 😊 मैं अभी एक बेसिक स्कूल असिस्टेंट हूँ। कृपया गणित, विज्ञान, हिंदी या अंग्रेजी से जुड़ा सवाल पूछें।";
}

</script>

</body>
</html>
